<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#747452">
<title>Cotizador · Unique</title>
<style>
:root{
  --pri:#747452; --pri-2:#5b5b3e; --bg:#f3f5f8; --card:#fff; --tx:#1c2430; --mut:#6b7686;
  --bd:#dfe4ea; --ok:#1f8a4c; --warn:#b7791f; --err:#c53030; --rad:10px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.hidden{display:none!important}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh}
#side{width:220px;background:var(--pri);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
#side .brand{padding:18px 16px;display:flex;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.15)}
#side .brand img{width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
#side .brand b{font-size:15px;line-height:1.2;word-break:break-word}
#side nav{flex:1;padding:10px 8px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:#e8eef5;padding:11px 12px;border-radius:8px;cursor:pointer;text-align:left;font-size:15px}
.nav-btn:hover{background:rgba(255,255,255,.1)}
.nav-btn.on{background:#fff;color:var(--pri);font-weight:600}
.nav-btn svg{width:20px;height:20px;flex-shrink:0}
#side .foot{padding:12px 16px;font-size:13px;border-top:1px solid rgba(255,255,255,.15)}
#side .foot button{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
#top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:#eef4fa;color:var(--pri);border:1px solid #cfe0f0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.old{background:#fff7e6;color:var(--warn);border-color:#f3dcae}
#main{padding:20px;max-width:1200px;width:100%;margin:0 auto;flex:1}
#bnav{display:none}

@media (max-width:820px){
  #side{display:none}
  #top{padding:10px 14px}
  #main{padding:14px 12px 90px}
  #bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  #bnav .nav-btn{flex-direction:column;gap:2px;color:var(--mut);font-size:11px;padding:8px 2px;border-radius:0;align-items:center;text-align:center}
  #bnav .nav-btn.on{background:none;color:var(--pri)}
}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);box-shadow:var(--sh);padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px}
.card h3{font-size:14px;margin:16px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:500}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=password],input[type=search],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font-size:15px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc3e6;border-color:var(--pri)}
textarea{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px;white-space:nowrap;text-decoration:none;color:var(--tx)}
.btn:hover{background:#f6f8fa}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-2)}
.btn.ok{background:#25d366;border-color:#20bd5a;color:#fff}
.btn.danger{color:var(--err);border-color:#f0c4c4}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn svg{width:17px;height:17px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--mut)}
.small{font-size:13px}
.right{text-align:right}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);border-bottom:1px solid var(--bd);padding:8px;white-space:nowrap}
table.t td{border-bottom:1px solid #eef1f4;padding:8px;vertical-align:middle}
table.t tr:hover td{background:#fafbfc}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eef1f4;color:#4a5565}
.badge.Pendiente{background:#fff4e0;color:#9a6200}
.badge.Aprobada{background:#e3f6ea;color:#1a7340}
.badge.Rechazada{background:#fde8e8;color:#a32020}
.badge.Vencida{background:#eceef1;color:#69707c}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--rad);padding:14px}
.stat .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;width:auto}
.toolbar select{width:auto;flex:0 0 auto}

/* Editor */
.ed-grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.ed-side{position:sticky;top:76px}
@media (max-width:1000px){.ed-grid{grid-template-columns:1fr}.ed-side{position:static}}
.lines td input{min-height:34px;padding:5px 7px;font-size:14px}
.lines .q{width:80px}.lines .p{width:105px}.lines .pfix{display:inline-block;padding:7px 2px;font-weight:600;white-space:nowrap}.lines .d{width:70px}
img[data-foto]:not([src]){visibility:hidden}.desc-w{display:flex;gap:8px;align-items:center}.pf-line{width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--bd);border-radius:6px;flex:0 0 auto}.pf-list{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:4px;display:block}.pf-prev{width:110px;height:110px;object-fit:contain;border:1px solid var(--bd);border-radius:8px;background:#fff}.addbar #e-pimg{width:40px;height:40px}
.doc table.d-it td.ft{width:54px;padding:3px;text-align:center;vertical-align:middle}.doc table.d-it td.ft img{width:48px;height:48px;object-fit:contain;display:block;margin:auto}
.addbar{display:grid;grid-template-columns:1fr 100px auto;gap:8px;margin-bottom:12px}
@media (max-width:600px){
  .addbar{grid-template-columns:1fr 80px}
  .addbar .btn{grid-column:1/-1}
  table.lines thead{display:none}
  table.lines tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--bd)}
  table.lines td{border:0;padding:0}
  table.lines td.desc{grid-column:1/-1;font-weight:600}
  table.lines td[data-l]{text-align:left}
  table.lines td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mut)}
  table.lines td.tot{grid-column:1/3;align-self:center;text-align:left!important;font-weight:700}
  table.lines td.del{text-align:right}
  .lines .q,.lines .p,.lines .d{width:100%}
}
.tot-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.tot-row.big{font-size:18px;font-weight:700;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.tot-row.bs{font-size:16px;font-weight:700;color:var(--pri)}

/* Buscador de clientes */
.cli-search{position:relative}
.cli-res{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.15);max-height:min(340px,55vh);overflow:auto;-webkit-overflow-scrolling:touch}
.cli-opt{padding:10px 12px;cursor:pointer;border-bottom:1px solid #eef1f4;color:var(--tx)}
.cli-opt:last-child{border-bottom:0}
.cli-opt.on,.cli-opt:hover{background:#fbeeee}
.cli-opt b{font-weight:600}
.cli-opt .small{display:block;margin-top:2px}
.cli-opt mark{background:#ffe9a8;color:inherit;padding:0}
.cli-foot{padding:8px 12px;font-size:12px;color:var(--mut);background:#fafbfc;position:sticky;bottom:0;border-top:1px solid var(--bd)}
.cli-sel{display:flex;gap:8px;align-items:center}
.cli-sel input{flex:1}

/* Modal & toast */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 12px;overflow:auto}
#modal .box{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal .box h2{margin:0 0 14px;font-size:18px}
#modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:8px;z-index:200;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.err{background:var(--err)}

/* Login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--pri),#3b3c28)}
#login .box{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#login img{max-width:220px;max-height:110px;border-radius:10px;display:block;margin:0 auto 10px}
#login h1{text-align:center;font-size:20px;margin:0 0 4px}
#login p{text-align:center;margin:0 0 18px}
#login form{display:flex;flex-direction:column;gap:12px}

/* ---------- Documento de cotización ---------- */
.doc-wrap{overflow-x:auto;background:#e9edf2;border-radius:var(--rad);padding:16px}
.doc{background:#fff;width:800px;max-width:none;margin:0 auto;padding:34px 38px;color:#1a1a1a;font-size:12.5px;line-height:1.35;font-family:"Segoe UI",Roboto,Arial,sans-serif;--dc:#0f4c81}
.doc .d-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--dc);padding-bottom:14px}
.doc .d-emp{display:flex;gap:14px;align-items:center}
.doc .d-emp img{max-width:120px;max-height:80px;object-fit:contain}
.doc .d-emp .n{font-size:18px;font-weight:700;color:var(--dc)}
.doc .d-emp div div{color:#444}
.doc .d-tit{text-align:right}
.doc .d-tit .t{font-size:24px;font-weight:800;color:var(--dc);letter-spacing:.06em}
.doc .d-tit .no{font-size:15px;font-weight:700;margin-top:2px}
.doc .d-tit table{margin-left:auto;margin-top:6px;border-collapse:collapse}
.doc .d-tit td{padding:1px 0 1px 10px;text-align:right}
.doc .d-tit td:first-child{color:#666}
.doc .d-cli{margin:16px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;background:#f5f7fa;border-left:4px solid var(--dc);padding:10px 14px}
.doc .d-cli .lb{color:#666;font-size:11px;text-transform:uppercase}
.doc table.d-it{width:100%;border-collapse:collapse;margin-top:6px}
.doc table.d-it th{background:var(--dc);color:#fff;font-size:11px;text-transform:uppercase;padding:7px 6px;text-align:left}
.doc table.d-it td{padding:6px;border-bottom:1px solid #e3e6ea;vertical-align:top}
.doc table.d-it tr:nth-child(even) td{background:#fafbfc}
.doc .n{text-align:right;white-space:nowrap}
.doc table.d-it th.n{text-align:right}
.doc .d-foot{display:flex;justify-content:space-between;gap:24px;margin-top:14px}
.doc .d-notes{flex:1;font-size:11.5px;color:#333}
.doc .d-notes b{color:var(--dc)}
.doc table.d-tot{border-collapse:collapse;min-width:280px}
.doc table.d-tot td{padding:4px 8px}
.doc table.d-tot td:last-child{text-align:right;white-space:nowrap}
.doc table.d-tot tr.g td{font-size:15px;font-weight:800;background:var(--dc);color:#fff}
.doc table.d-tot tr.bs td{font-size:14px;font-weight:700;color:var(--dc);border-top:1px solid #ccd}
.doc .d-sign{margin-top:44px;display:flex;justify-content:space-between;gap:30px;font-size:11.5px}
.doc .d-sign div{flex:1;border-top:1px solid #888;text-align:center;padding-top:4px;color:#555}
.doc .d-bottom{margin-top:22px;text-align:center;font-size:10.5px;color:#777;border-top:1px solid #e3e6ea;padding-top:8px}

#print-area{display:none}
@media print{
  @page{size:letter;margin:10mm}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  #print-area .doc{width:auto;padding:0;box-shadow:none}
  .doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="login" class="hidden"></div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><img id="side-logo" alt="" class="hidden"><b id="side-name">Cotizador</b></div>
    <nav id="side-nav"></nav>
    <div class="foot"><div id="side-user"></div><button data-act="logout">Cambiar nombre</button></div>
  </aside>
  <div id="wrap">
    <header id="top">
      <h1 id="title">Cotizador</h1>
      <span id="tasa-chip" class="chip" data-act="tasa" title="Tasa BCV del día">Bs/USD …</span>
      <button class="btn sm" data-act="menu" aria-label="Mi nombre" id="user-btn">👤</button>
    </header>
    <main id="main"></main>
  </div>
  <nav id="bnav"></nav>
</div>

<div id="modal" class="hidden"><div class="box" id="modal-box"></div></div>
<div id="toast" class="hidden"></div>
<div id="print-area"></div>

function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(iso, n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+(+n||0)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fdate(iso){ if(!iso) return ''; const [y,m,d]=String(iso).slice(0,10).split('-'); return d ? `${d}/${m}/${y}` : String(iso); }

/* ---------- Servidor ---------- */
async function api(action, payload, opts){
  opts = opts || {};
  if(!API) throw new Error('Falta la dirección del servidor');
  const body = JSON.stringify(Object.assign({ action, device:DEVICE, vendedor:USER.nombre }, payload || {}));
  let r, txt = '';
  try{ r = await fetch(API, { method:'POST', body, redirect:'follow' }); }
  catch(e){
    // Respaldo: las lecturas también funcionan por GET
    if(action === 'all' || action === 'ping'){
      try{ r = await fetch(API + '?action=' + action + (payload && payload.rev ? '&rev=' + encodeURIComponent(payload.rev) : '') + '&t=' + Date.now(), { redirect:'follow' }); }
      catch(e2){ setOnline(false); throw new Error('No hay conexión con el servidor (' + (e2.message || 'error de red') + '). Revisa tu internet.'); }
    } else { setOnline(false); throw new Error('No hay conexión con el servidor (' + (e.message || 'error de red') + '). Revisa tu internet.'); }
  }
  let j;
  try{ txt = await r.text(); j = JSON.parse(txt); }
  catch(e){
    setOnline(false);
    const t = String(txt).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
    let pista = 'El servidor respondió algo que no es la app (código ' + r.status + ').';
    if(/doGet|doPost/.test(t)) pista = 'El servidor no tiene el código del cotizador bien pegado (no encuentra doGet/doPost).';
    else if(/accounts\.google|Iniciar sesi|Sign in|inicia sesi/i.test(t + r.url)) pista = 'Google pide iniciar sesión: el acceso de la implementación no está en "Cualquier persona".';
    else if(r.status === 404) pista = 'La dirección del servidor no existe (404). Revisa que la implementación esté activa y la dirección completa.';
    throw new Error(pista + (t ? ' Respuesta: «' + t + '»' : ''));
  }
  setOnline(true);
  if(!j.ok) throw new Error(j.error || 'Error del servidor');
  return j;
}
function setOnline(v){ ONLINE = v; const s = $('#sync'); if(s){ s.textContent = v ? '' : 'Sin conexión'; s.classList.toggle('hidden', v); } }
function applyData(d){
  DB = { config:mergeConfig(d.config), usuarios:[], clientes:d.clientes||[], productos:d.productos||[], cotizaciones:d.cotizaciones||[] };
  LAST_SYNC = Date.now();
  saveCache();
}
function saveCache(){ try{ localStorage.setItem(CACHE_KEY(), JSON.stringify(Object.assign({ _rev:REV }, DB))); }catch(e){ /* sin espacio: la app sigue funcionando en línea */ } }
function loadCache(){ try{ const d = JSON.parse(LS.get(CACHE_KEY()) || 'null'); if(d){ REV = d._rev || ''; DB = { config:mergeConfig(d.config), usuarios:d.usuarios||[], clientes:d.clientes||[], productos:d.productos||[], cotizaciones:d.cotizaciones||[] }; return true; } }catch(e){} return false; }
async function refresh(silent){
  try{
    const j = await api('all', { rev:REV });
    if(j.same){ LAST_SYNC = Date.now(); return true; }
    if(!(j.data.config && j.data.config.empresa && j.data.config.empresa.nombre)){
      // Primer uso: guarda en el servidor los datos de la empresa que trae la app
      const d = defaultConfig(), logo = d.empresa.logo; delete d.empresa.logo;
      try{ const k = await api('init', { config:d, logo }); j.data.config = k.config; }catch(e){ /* se reintenta en la próxima sincronización */ }
    }
    REV = j.rev || ''; applyData(j.data);
    return true;
  }catch(e){ LAST_ERR = e.message; if(!silent) toast(e.message, true); return false; }
}
function upsertLocal(col, rec){ const i = DB[col].findIndex(x => x.id === rec.id); if(i >= 0) DB[col][i] = rec; else DB[col].push(rec); saveCache(); }
function removeLocal(col, id){ DB[col] = DB[col].filter(x => x.id !== id); saveCache(); }
async function saveRec(col, rec, nuevo){
  const j = await api('put', { col, rec:plain(rec), nuevo:!!nuevo });
  upsertLocal(col, j.rec);
  if(col === 'cotizaciones' && nuevo) refresh(true);
  return j.rec;
}
async function delRec(col, id){ await api('del', { col, id }); removeLocal(col, id); }
async function busy(btn, fn){
  const txt = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
  try{ return await fn(); }
  catch(e){ toast(e.message, true); return undefined; }
  finally{ if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = txt; } }
}

const TASA_SOURCES = [

  { url:'https://pydolarve.org/api/v2/dollar?page=bcv', parse:j => ({ valor:+(j.monitors?.usd?.price), fuente:'BCV · pydolarve.org' }) }

async function fetchTasa(){
  for(const s of TASA_SOURCES){
    try{
      const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 8000);
      const r = await fetch(s.url, {cache:'no-store', signal:ctl.signal}); clearTimeout(tm);
      if(!r.ok) continue;
      const d = s.parse(await r.json());
      if(d.valor > 0){ return await saveTasa({ valor:Math.round(d.valor*10000)/10000, fecha:hoy(), fuente:d.fuente }); }
    }catch(e){ console.warn('Tasa', s.url, e); }

  throw new Error('No se pudo obtener la tasa');
}

/* ---------- Cálculos ---------- */
function rateOf(tipo, q){ return tipo==='E' ? 0 : tipo==='R' ? (+q.ivaReducido||0) : (+q.ivaGeneral||0); }
function calc(q){
  let bruto=0, desc=0; const bases = {};
  for(const it of (q.items||[])){
    const b = r2(num(it.cantidad) * num(it.precio));
    const d = r2(b * num(it.descuento) / 100);
    bruto += b; desc += d;
    const r = rateOf(it.ivaTipo, q);
    bases[r] = (bases[r]||0) + (b - d);
  }
  let iva = 0; const ivas = {};
  Object.keys(bases).forEach(r => { ivas[r] = r2(bases[r] * r / 100); iva += ivas[r]; });
  const neto = r2(bruto - desc), total = r2(neto + iva);
  return { bruto:r2(bruto), desc:r2(desc), neto, bases, ivas, iva:r2(iva), total, totalBs: r2(total * (+q.tasa||0)) };
}
function lineTotal(it){ const b = r2(num(it.cantidad)*num(it.precio)); return r2(b - r2(b*num(it.descuento)/100)); }
function estadoDe(q){ if(q.estado==='Pendiente' && q.vence && q.vence < hoy()) return 'Vencida'; return q.estado || 'Pendiente'; }
function numero(n){ return (C().prefijo||'') + String(n).padStart(+C().digitos||1, '0'); }
const canTouch = q => true;

const normTxt = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
let CLI_IDX = null, CLI_IDX_SRC = null;
function clientIndex(){
  if(CLI_IDX && CLI_IDX_SRC === DB.clientes) return CLI_IDX;
  CLI_IDX_SRC = DB.clientes;
  CLI_IDX = DB.clientes.map(c => ({ c, n:normTxt(c.nombre), k:normTxt([c.nombre, c.rif, String(c.rif||'').replace(/[^0-9a-z]/gi,''), c.contacto, c.telefono, String(c.telefono||'').replace(/\D/g,''), c.email].join(' ')) }));
  return CLI_IDX;
}
function buscarClientes(q, max){
  const words = normTxt(q).split(/\s+/).filter(Boolean);
  if(!words.length) return { list:[], total:0 };
  const res = [];
  for(const it of clientIndex()){
    if(words.every(w => it.k.includes(w))){
      const score = it.n.startsWith(words[0]) ? 0 : it.n.includes(' ' + words[0]) ? 1 : 2;
      res.push({ it, score });
    }
  }
  res.sort((a,b) => a.score - b.score || a.it.n.localeCompare(b.it.n));
  return { list:res.slice(0, max).map(r => r.it.c), total:res.length };
}
function marcar(text, q){
  let h = esc(text);
  normTxt(q).split(/\s+/).filter(w => w.length > 1).forEach(w => {
    const t = normTxt(text), i = t.indexOf(w);
    if(i >= 0 && t.length === String(text).length){ const raw = String(text); h = h.replace(esc(raw.slice(i, i + w.length)), m => '<mark>' + m + '</mark>'); }
  });
  return h;
}
function setupClienteSearch(){
  const inp = $('#e-cli-q'), box = $('#e-cli-res'), clr = $('#e-cli-x');

  const close = () => { box.classList.add('hidden'); act = -1; };
  const elegir = c => {
    draft.clienteId = c.id; editorDirty = true;
    inp.value = c.nombre + ' — ' + c.rif; clr.classList.remove('hidden');
    close(); cliInfo(); inp.blur();
  };
  const pintar = () => {
    const q = inp.value.trim();
    if(q.length < 2){ box.innerHTML = q ? '<div class="cli-foot">Escribe al menos 2 letras o números…</div>' : ''; box.classList.toggle('hidden', !q); items = []; return; }
    const r = buscarClientes(q, 40); items = r.list; act = items.length ? 0 : -1;
    box.innerHTML = items.length
      ? items.map((c,i) => `<div class="cli-opt${i===act?' on':''}" data-i="${i}" role="option"><b>${marcar(c.nombre, q)}</b><span class="small muted">${esc(c.rif)}${c.telefono?' · '+esc(c.telefono):''}${c.contacto?' · '+esc(c.contacto):''}</span></div>`).join('')
        + `<div class="cli-foot">${r.total > items.length ? `Mostrando ${items.length} de ${r.total}. Escribe más para afinar.` : `${r.total} cliente(s)`}</div>`
      : `<div class="cli-opt" data-new="1"><b>No se encontró “${esc(q)}”</b><span class="small muted">Toca aquí para crear un cliente nuevo</span></div>`;
    box.classList.remove('hidden');
  };
  const mover = d => { if(!items.length) return; act = (act + d + items.length) % items.length; box.querySelectorAll('.cli-opt').forEach((el,i) => el.classList.toggle('on', i === act)); const el = box.querySelector('.cli-opt.on'); if(el) el.scrollIntoView({ block:'nearest' }); };
  inp.addEventListener('input', () => {
    if(draft.clienteId){ draft.clienteId = ''; clr.classList.add('hidden'); cliInfo(); }
    clearTimeout(timer); timer = setTimeout(pintar, 120);
  });
  inp.addEventListener('focus', () => { if(draft.clienteId) inp.select(); else if(inp.value.trim()) pintar(); });
  inp.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); if(box.classList.contains('hidden')) pintar(); else mover(1); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); mover(-1); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(act >= 0 && items[act]) elegir(items[act]); }
    else if(e.key === 'Escape'){ close(); }
  });
  box.addEventListener('mousedown', e => e.preventDefault());

    const o = e.target.closest('.cli-opt'); if(!o) return;

    const c = items[+o.dataset.i]; if(c) elegir(c);
  });
  inp.addEventListener('blur', () => setTimeout(() => {
    close();
    if(!draft || !document.body.contains(inp)) return;
    if(!draft.clienteId && inp.value.trim()){ const r = buscarClientes(inp.value, 2); if(r.total === 1) elegir(r.list[0]); }
  }, 150));
  clr.onclick = () => { draft.clienteId = ''; editorDirty = true; inp.value = ''; clr.classList.add('hidden'); cliInfo(); inp.focus(); };
}

const FOTOS_BASE = 'https://ijmf1978.github.io/cotizador/'; // misma base de fotos del cotizador principal
let FOTO_IDX = null; const FOTO_CHUNK = {}, FOTO_LOAD = {};
async function cargarIndiceFotos(){
  try{ const r = await fetch(FOTOS_BASE + 'fotos-index.json', { cache:'no-cache' }); if(r.ok){ const j = await r.json(); FOTO_IDX = j.codigos || {}; } }
  catch(e){ console.warn('Fotos no disponibles', e); }
  return FOTO_IDX;
}
const fotoKey = c => String(c || '').trim().toUpperCase();
const tieneFoto = c => !!fotoCod(c);
function cargarChunkFotos(n){
  if(FOTO_CHUNK[n]) return Promise.resolve(FOTO_CHUNK[n]);
  if(!FOTO_LOAD[n]) FOTO_LOAD[n] = fetch(FOTOS_BASE + 'fotos-' + String(n).padStart(2,'0') + '.json')
    .then(r => r.ok ? r.json() : {}).then(j => (FOTO_CHUNK[n] = j))
    .catch(() => { delete FOTO_LOAD[n]; return {}; });
  return FOTO_LOAD[n];
}
// Busca el código exacto; si no está, prueba sin espacios y quitando el último tramo (GRI-460-461 → GRI-460, LAV-14B → LAV-14)
function fotoCod(c){
  if(!FOTO_IDX) return '';
  let k = fotoKey(c); if(FOTO_IDX[k]) return k;
  k = k.replace(/\s+/g,''); if(FOTO_IDX[k]) return k;
  let t = k; while(t.includes('-')){ t = t.slice(0, t.lastIndexOf('-')); if(FOTO_IDX[t]) return t; }
  const m = k.match(/^([A-Z]+-\d+)[A-Z]+$/); if(m && FOTO_IDX[m[1]]) return m[1];
  return '';
}
async function fotoDe(c){ const k = fotoCod(c), n = k && FOTO_IDX[k]; if(!n) return ''; const ch = await cargarChunkFotos(n); return ch[k] || ''; }
function fotoTag(c, cls){ return tieneFoto(c) ? `<img class="${cls||''}" data-foto="${esc(fotoKey(c))}" alt="">` : ''; }
async function ponerFoto(im){ const s = await fotoDe(im.dataset.foto); if(s){ im.src = s; if(!im.complete) await new Promise(r => { im.onload = im.onerror = r; }); } else im.remove(); }
let fotoObs = null;
function pintarFotos(root, lazy){
  const ims = [...(root || document).querySelectorAll('img[data-foto]:not([src])')];
  if(lazy && 'IntersectionObserver' in window){
    if(!fotoObs) fotoObs = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ fotoObs.unobserve(e.target); ponerFoto(e.target); } }), { rootMargin:'400px' });
    ims.forEach(i => fotoObs.observe(i)); return Promise.resolve();
  }
  return Promise.all(ims.map(ponerFoto));
}

function fitDoc(){ const w = $('.doc-wrap'), d = w && w.querySelector('.doc'); if(!d) return; const avail = w.clientWidth - 32; d.style.zoom = avail < 800 ? String(Math.max(0.4, avail/800)) : ''; }
window.addEventListener('resize', () => { if(currentView()==='historial' && location.hash.startsWith('#/ver/')) fitDoc(); });
function quoteAction(a, q){
  if(a==='print') return printQuote(q);
  if(a==='pdf') return pdfQuote(q);
  if(a==='wa') return waQuote(q);
  if(a==='edit'){ draft = null; return go('#/editar/'+q.id); }
  if(a==='dup'){
    const d = plain(q); const c = C();
    Object.assign(d, { id:null, numero:'', fecha:hoy(), vence:addDays(hoy(), d.vigenciaDias||c.vigenciaDias), estado:'Pendiente', tasa:+c.tasa.valor||d.tasa, usuario:USER.nombre, usuarioId:USER.id, _from:'nueva' });
    delete d.creado; delete d.modificado;
    (d.items||[]).forEach(it => { it.descuento = 0; const p = DB.productos.find(x => x.id === it.productoId); if(p) it.precio = num(p.precio); });
    draft = d; toast('Copia creada: revisa y guarda'); return go('#/nueva');
  }
  if(a==='del') return confirmBox(`¿Eliminar la cotización <b>${esc(q.numero)}</b>? Esta acción no se puede deshacer.`, async () => {
    try{ await delRec('cotizaciones', q.id); toast('Cotización eliminada'); route(true); }catch(e){ toast(e.message, true); } });
}
async function printQuote(q){
  await FOTOS_READY;
  const pa = $('#print-area'); pa.innerHTML = docHTML(q);
  await pintarFotos(pa);
  const imgs = [...pa.querySelectorAll('img')];
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => {
    const prev = document.title; document.title = q.numero + ' - ' + (q.cliente?.nombre||'');
    window.print(); document.title = prev;
  });
}
let html2pdfLoading;
function loadHtml2pdf(){
  if(window.html2pdf) return Promise.resolve();
  if(html2pdfLoading) return html2pdfLoading;
  html2pdfLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload = res; s.onerror = () => { html2pdfLoading = null; rej(new Error('No se pudo cargar el generador de PDF (requiere internet)')); };
    document.head.appendChild(s);
  });
  return html2pdfLoading;
}
async function makePdfBlob(q){
  await loadHtml2pdf();
  await FOTOS_READY;
  const holder = document.createElement('div'); holder.innerHTML = docHTML(q);
  await pintarFotos(holder);
  const el = holder.firstElementChild; el.style.width = '740px'; el.style.padding = '10px 14px'; el.style.margin = '0';
  return await html2pdf().set({
    margin:[8,8,8,8], filename:q.numero+'.pdf', image:{type:'jpeg', quality:0.96},
    html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', scrollX:0, scrollY:0},
    jsPDF:{unit:'mm', format:'letter', orientation:'portrait'}, pagebreak:{mode:['css','legacy'], avoid:'tr'}
  }).from(el).outputPdf('blob');
}
function fileName(q){ return (q.numero + ' ' + (q.cliente?.nombre||'')).replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,80) + '.pdf'; }
async function pdfQuote(q){
  toast('Generando PDF…');
  try{
    const blob = await makePdfBlob(q);
    download(fileName(q), blob);
    toast('PDF descargado');
  }catch(e){ console.error(e); toast(e.message + '. Usa "Imprimir" → Guardar como PDF.', true); }
}
function waPhone(tel){
  let d = String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('00')) d = d.slice(2);
  if(d.startsWith('0')) d = '58' + d.slice(1);
  else if(d.length === 10 && d.startsWith('4')) d = '58' + d;
  return d;
}
function waText(q){
  const e = C().empresa, t = calc(q);
  let s = `*COTIZACIÓN N° ${q.numero}*\n${e.nombre} · RIF ${e.rif}\n\nCliente: ${q.cliente?.nombre}\nFecha: ${fdate(q.fecha)} · Válida hasta: ${fdate(q.vence)}\n\n`;
  (q.items||[]).forEach(it => { s += `• ${nf2.format(it.cantidad)} ${it.unidad||''} ${it.descripcion} — ${usd(lineTotal(it))}\n`; });
  s += `\nSubtotal: ${usd(t.bruto)}\n`;
  if(t.desc) s += `Descuento: -${usd(t.desc)}\n`;
  Object.keys(t.ivas).filter(r=>+r>0).forEach(r => s += `IVA ${nf2.format(r)}%: ${usd(t.ivas[r])}\n`);
  s += `*Total: ${usd(t.total)}*\n`;
  if(q.tasa) s += `Total Bs: ${bs(t.totalBs)} (tasa BCV ${nf4.format(q.tasa)})\n`;
  if(q.cliente?.condicion) s += `Condición de pago: ${q.cliente.condicion}\n`;
  return s;
}
function waQuote(q){
  const phone = waPhone(q.cliente?.telefono);
  const canFiles = !!(navigator.canShare && window.File && (()=>{ try{ return navigator.canShare({files:[new File(['x'],'t.pdf',{type:'application/pdf'})]}); }catch(e){ return false; } })());
  modal(`<h2>Enviar por WhatsApp</h2>
    <p class="small muted">Cliente: <b>${esc(q.cliente?.nombre)}</b> · Tel: ${esc(q.cliente?.telefono||'sin teléfono')}</p>
    <label class="f">Número WhatsApp (con código de país)<input type="tel" id="wa-n" value="${esc(phone)}" placeholder="584141234567"></label>
    <div class="btns" style="flex-direction:column;margin-top:14px">
      ${canFiles?`<button class="btn ok" id="wa-pdf">${ICON.wa} Compartir PDF (elige WhatsApp)</button>`:''}
      <button class="btn ${canFiles?'':'ok'}" id="wa-txt">${ICON.wa} Enviar resumen como mensaje</button>
      ${!canFiles?`<button class="btn" id="wa-dl">${ICON.pdf} Descargar PDF para adjuntarlo</button>`:''}
    </div>
    <p class="small muted">${canFiles?'En el celular, "Compartir PDF" adjunta el archivo directamente.':'En computadora: envía el resumen y adjunta el PDF descargado en WhatsApp Web.'}</p>
    <div class="acts"><button class="btn" data-act="close">Cerrar</button></div>`, b => {
      b.querySelector('#wa-txt').onclick = () => {
        const n = waPhone(b.querySelector('#wa-n').value);
        window.open(`https://wa.me/${n}?text=${encodeURIComponent(waText(q))}`, '_blank');
      };
      const dl = b.querySelector('#wa-dl'); if(dl) dl.onclick = () => pdfQuote(q);
      const sp = b.querySelector('#wa-pdf');
      if(sp) sp.onclick = async () => {
        sp.disabled = true; sp.textContent = 'Generando PDF…';
        try{
          const blob = await makePdfBlob(q);
          const file = new File([blob], fileName(q), {type:'application/pdf'});
          sp.disabled = false; sp.innerHTML = ICON.wa + ' PDF listo — tocar para compartir';
          sp.onclick = async () => {
            try{ await navigator.share({ files:[file], title:'Cotización '+q.numero, text:`Cotización ${q.numero} - ${C().empresa.nombre}` }); closeModal(); }
            catch(e){ if(e.name!=='AbortError') toast('No se pudo compartir: ' + e.message, true); }
          };
        }catch(e){ toast(e.message, true); sp.disabled=false; sp.innerHTML = ICON.wa + ' Compartir PDF (elige WhatsApp)'; }
      };
    });
}

/* ---------- Historial ---------- */
let histState = { q:'', est:'', mes:'', mias:false };

  const delMes = DB.cotizaciones.filter(q => String(q.fecha||'').slice(0,7) === now);
  const pend = DB.cotizaciones.filter(q => estadoDe(q) === 'Pendiente');
  const aprob = delMes.filter(q => q.estado === 'Aprobada');
  $('#main').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="k">Cotizaciones del mes</div><div class="v">${delMes.length}</div></div>
      <div class="stat"><div class="k">Monto del mes</div><div class="v">${usd(delMes.reduce((s,q)=>s+(+q.total||0),0))}</div></div>
      <div class="stat"><div class="k">Pendientes</div><div class="v">${pend.length}</div></div>
      <div class="stat"><div class="k">Aprobadas (mes)</div><div class="v">${usd(aprob.reduce((s,q)=>s+(+q.total||0),0))}</div></div>

        <input type="month" id="h-mes" value="${histState.mes}" style="width:auto;min-height:40px;border:1px solid var(--bd);border-radius:8px;padding:6px 8px">

        <button class="btn pri" id="h-new">${ICON.nueva} Nueva</button>

    </div>`;

  $('#h-sync').onclick = async ev => { const b = ev.currentTarget; b.disabled = true; if(await refresh()){ renderShell(); viewHistorial(); toast('Datos actualizados'); } else b.disabled = false; };
  renderHist();
}
function renderHist(){
  const s = histState.q.trim().toLowerCase();
  const list = DB.cotizaciones.filter(q => {
    if(histState.est && estadoDe(q) !== histState.est) return false;
    if(histState.mes && String(q.fecha||'').slice(0,7) !== histState.mes) return false;
    if(histState.mias && q.usuarioId !== USER.id) return false;
    if(s && !(`${q.numero} ${q.cliente?.nombre} ${q.cliente?.rif} ${q.usuario}`.toLowerCase().includes(s))) return false;
    return true;
  }).sort((a,b) => (String(b.fecha)+String(b.creado||'')).localeCompare(String(a.fecha)+String(a.creado||'')));
  const el = $('#h-list');
  if(!DB.cotizaciones.length){ el.innerHTML = `<div class="empty"><p>Aún no hay cotizaciones guardadas.</p><button class="btn pri" id="h-first">Crear la primera</button></div>`; $('#h-first').onclick = () => { draft = null; go('#/nueva'); }; return; }
  if(!list.length){ el.innerHTML = `<div class="empty">Sin resultados</div>`; return; }
  el.innerHTML = `<div class="tbl-wrap"><table class="t"><thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th class="num">Total USD</th><th class="num">Total Bs</th><th>Estado</th><th></th></tr></thead><tbody>
    ${list.map(q => { const st = estadoDe(q); return `<tr>
      <td><a href="#/ver/${q.id}"><b>${esc(q.numero)}</b></a></td>
      <td>${fdate(q.fecha)}</td>
      <td>${esc(q.cliente?.nombre)}<div class="small muted">${esc(q.cliente?.rif)}</div></td>
      <td class="small">${esc(q.usuario)}</td>
      <td class="num"><b>${usd(q.total)}</b></td>
      <td class="num">${q.tasa?bs(q.totalBs):'—'}</td>
      <td><span class="badge ${st}">${st}</span></td>
      <td class="num"><div class="btns" style="justify-content:flex-end;flex-wrap:nowrap">
        <button class="btn sm" data-h="ver" data-id="${q.id}">Ver</button>
        <button class="btn sm ok" data-h="wa" data-id="${q.id}" aria-label="WhatsApp">${ICON.wa}</button>
        <button class="btn sm" data-h="dup" data-id="${q.id}">Duplicar</button>
        ${canTouch(q)?`<button class="btn sm danger" data-h="del" data-id="${q.id}" aria-label="Eliminar">✕</button>`:''}
      </div></td></tr>`; }).join('')}
  </tbody></table></div><p class="small muted">${list.length} cotización(es) · actualizado ${new Date(LAST_SYNC||Date.now()).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})}</p>`;
  el.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
    const q = DB.cotizaciones.find(x => x.id === b.dataset.id);
    if(b.dataset.h === 'ver') go('#/ver/'+q.id); else quoteAction(b.dataset.h, q);
  });
}

let cliQ = '';
function viewClientes(){

    <div class="toolbar">
      <input type="search" id="c-q" placeholder="Buscar cliente por nombre, RIF, contacto…" value="${esc(cliQ)}">

  $('#c-exp').onclick = () => exportExcel('clientes', DB.clientes, `clientes-${hoy()}.xlsx`);
  $('#c-imp').onclick = () => importExcel('clientes', async rows => {
    const recs = rows.filter(r => r.nombre || r.rif).map(r => ({ rif:String(r.rif||'').toUpperCase(), nombre:String(r.nombre||''), contacto:String(r.contacto||''), telefono:String(r.telefono||''), email:String(r.email||''), direccion:String(r.direccion||''), condicion:String(r.condicion||'Contado') }));

    catch(e){ toast(e.message, true); }
  });
  renderCli();

function renderCli(){
  const s = cliQ.trim().toLowerCase();
  const list = DB.clientes.filter(c => !s || `${c.nombre} ${c.rif} ${c.contacto} ${c.email} ${c.telefono}`.toLowerCase().includes(s)).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  const el = $('#c-list');
  if(!DB.clientes.length){ el.innerHTML = `<div class="empty">No hay clientes registrados. Agrega el primero o importa tu lista desde Excel.</div>`; return; }
  if(!list.length){ el.innerHTML = `<div class="empty">Sin resultados</div>`; return; }
  el.innerHTML = `<div class="tbl-wrap"><table class="t"><thead><tr><th>Cliente</th><th>RIF / C.I.</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>Cond. pago</th><th></th></tr></thead><tbody>
    ${list.map(c => `<tr><td><b>${esc(c.nombre)}</b></td><td>${esc(c.rif)}</td><td>${esc(c.contacto)}</td><td>${esc(c.telefono)}</td><td>${esc(c.email)}</td><td>${esc(c.condicion)}</td>
    <td class="num"><div class="btns" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm" data-e="${c.id}">Editar</button><button class="btn sm" data-cot="${c.id}">Cotizar</button>${isAdmin()?`<button class="btn sm danger" data-d="${c.id}">✕</button>`:''}</div></td></tr>`).join('')}
  </tbody></table></div><p class="small muted">${list.length} cliente(s)</p>`;
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => clienteForm(DB.clientes.find(c=>c.id===b.dataset.e), renderCli));
  el.querySelectorAll('[data-cot]').forEach(b => b.onclick = () => { draft = newDraft(); draft.clienteId = b.dataset.cot; go('#/nueva'); });
  el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const c = DB.clientes.find(x=>x.id===b.dataset.d);
    confirmBox(`¿Eliminar el cliente <b>${esc(c.nombre)}</b>? Las cotizaciones ya emitidas se conservan.`, async () => { try{ await delRec('clientes', c.id); renderCli(); }catch(e){ toast(e.message, true); } }); });
}

  let v = c || { rif:'', nombre:'', contacto:'', telefono:'', email:'', direccion:'', condicion:'Contado' };

  modal(`<h2>${c?'Editar':'Nuevo'} cliente</h2><form id="cf"><div class="grid2">
    <label class="f">RIF / C.I. *<input type="text" name="rif" value="${esc(v.rif)}" placeholder="J-12345678-9" required></label>

    <label class="f">Teléfono (WhatsApp)<input type="tel" name="telefono" value="${esc(v.telefono)}" placeholder="0414-1234567"></label>
    <label class="f">Email<input type="email" name="email" value="${esc(v.email)}"></label>
    <label class="f">Condiciones de pago<input type="text" name="condicion" list="cond-l" value="${esc(v.condicion)}"><datalist id="cond-l">${CONDICIONES.map(x=>`<option value="${x}">`).join('')}</datalist></label>
    <label class="f" style="grid-column:1/-1">Dirección fiscal<textarea name="direccion" rows="2">${esc(v.direccion)}</textarea></label>

      const dup = DB.clientes.find(x => String(x.rif).toUpperCase() === f.rif && (!c || x.id !== c.id));
      if(dup) return toast('Ya existe un cliente con ese RIF: ' + dup.nombre, true);
      busy(b.querySelector('#cf-save'), async () => {
        const obj = await saveRec('clientes', Object.assign({}, c||{}, f), !c);
        closeModal(); toast('Cliente guardado'); done && done(obj);
      });
    };
  });
}

/* ---------- Productos ---------- */
let prodQ = '', prodCat = '';
const IVA_LBL = t => t==='E' ? 'Exento' : t==='R' ? `Reducido (${nf2.format(C().ivaReducido)}%)` : `General (${nf2.format(C().ivaGeneral)}%)`;
function viewProductos(){
  const cats = [...new Set(DB.productos.map(p => p.categoria).filter(Boolean))].sort();
  $('#main').innerHTML = `<div class="card">
    <div class="toolbar">
      <input type="search" id="p-q" placeholder="Buscar por código o descripción…" value="${esc(prodQ)}">
      <select id="p-cat"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${prodCat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      ${isAdmin()?`<button class="btn pri" id="p-new">+ Nuevo producto</button><button class="btn" id="p-imp">Importar Excel</button>`:''}
      <button class="btn" id="p-exp">Exportar Excel</button>
    </div><div id="p-list"></div></div>`;
  $('#p-q').oninput = e => { prodQ = e.target.value; renderProd(); };
  $('#p-cat').onchange = e => { prodCat = e.target.value; renderProd(); };
  $('#p-exp').onclick = () => exportExcel('productos', DB.productos.map(p => ({...p, iva: p.ivaTipo||'G'})), `productos-${hoy()}.xlsx`);
  if(isAdmin()){
    $('#p-new').onclick = () => productoForm(null);
    $('#p-imp').onclick = () => importExcel('productos', async rows => {
      const todos = new Set(rows.map(r => String(r.codigo ?? '').trim().toUpperCase())), usados = new Set();
      let renombrados = 0;
      const recs = rows.filter(r => r.codigo !== '' && r.codigo != null).map(r => {
        let cod = String(r.codigo).trim();
        if(usados.has(cod.toUpperCase())){ let n = 2; while(todos.has((cod+'-'+n).toUpperCase()) || usados.has((cod+'-'+n).toUpperCase())) n++; cod = cod + '-' + n; renombrados++; }
        usados.add(cod.toUpperCase());
        const iv = String(r.iva === '' || r.iva == null ? 'G' : r.iva).trim().toUpperCase().replace('%','');
        const ivaTipo = ['E','EXENTO','0','NO','EX'].includes(iv) ? 'E' : ['R','REDUCIDO','8','0.08'].includes(iv) ? 'R' : 'G';
        return { codigo:cod, descripcion:String(r.descripcion||''), categoria:String(r.categoria||''), unidad:String(r.unidad||'UND'), precio:num(r.precio), ivaTipo };
      });
      toast('Importando ' + recs.length + ' productos…');
      try{ const j = await api('bulk', { col:'productos', recs }); DB.productos = j.data; saveCache(); toast(`Productos: ${j.nuevos} nuevos, ${j.actualizados} actualizados${renombrados?` · ${renombrados} códigos repetidos renombrados (ej. GRI-100-2)`:''}`); viewProductos(); }
      catch(e){ toast(e.message, true); }
    });
  }
  renderProd();
}
function renderProd(){
  const s = prodQ.trim().toLowerCase(), t = C().tasa.valor;
  const list = DB.productos.filter(p => (!prodCat || p.categoria === prodCat) && (!s || `${p.codigo} ${p.descripcion} ${p.categoria}`.toLowerCase().includes(s))).sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo), 'es', {numeric:true}));
  const el = $('#p-list');
  if(!DB.productos.length){ el.innerHTML = `<div class="empty">No hay productos registrados.${isAdmin()?' Crea uno o importa tu lista desde Excel.':''}</div>`; return; }
  if(!list.length){ el.innerHTML = `<div class="empty">Sin resultados</div>`; return; }

/* ---------- Excel ---------- */
const HEADERS = {
  productos:{ codigo:'Código', descripcion:'Descripción', categoria:'Categoría', unidad:'Unidad', precio:'Precio USD', iva:'IVA (G/R/E)' },
  clientes:{ rif:'RIF / C.I.', nombre:'Razón social', contacto:'Contacto', telefono:'Teléfono', email:'Email', direccion:'Dirección', condicion:'Condición de pago' }
};
const EJEMPLO = {
  productos:[{ codigo:'EJ-001', descripcion:'Ejemplo: borra esta fila', categoria:'General', unidad:'UND', precio:10.5, iva:'G' }],
  clientes:[{ rif:'J-00000000-0', nombre:'Ejemplo: borra esta fila', contacto:'Nombre Apellido', telefono:'0414-0000000', email:'correo@ejemplo.com', direccion:'Caracas', condicion:'Contado' }]
};
let xlsxLoading;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => { xlsxLoading = null; rej(new Error('No se pudo cargar el módulo de Excel (requiere internet)')); };
    document.head.appendChild(s);
  });
  return xlsxLoading;
}
async function exportExcel(tipo, rows, filename){
  try{ await loadXLSX(); }catch(e){ return toast(e.message, true); }
  const map = HEADERS[tipo], keys = Object.keys(map);
  const data = rows.length ? rows : EJEMPLO[tipo];
  const aoa = [keys.map(k => map[k])].concat(data.map(r => keys.map(k => k==='precio' ? num(r[k]) : (r[k] ?? ''))));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = keys.map(k => ({ wch: k==='descripcion'||k==='nombre'||k==='direccion' ? 40 : 16 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, tipo==='productos'?'Productos':'Clientes');
  const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
  download(filename, new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}
function normRows(aoa){
  const norm = s => String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
  const alias = { description:'descripcion', producto:'descripcion', articulo:'descripcion', preciousd:'precio', price:'precio', preciodelista:'precio',
    razonsocial:'nombre', cliente:'nombre', ci:'rif', rifci:'rif', cedula:'rif', condiciondepago:'condicion', condicionesdepago:'condicion', condicionpago:'condicion',
    tel:'telefono', correo:'email', cod:'codigo', und:'unidad', ivagre:'iva', impuesto:'iva' };
  const hi = aoa.findIndex(r => r.some(c => String(c ?? '').trim()));
  if(hi < 0) return [];
  const keys = aoa[hi].map(h => { const n = norm(h); return alias[n] || n; });
  return aoa.slice(hi+1).filter(r => r.some(c => String(c ?? '').trim()))
    .map(r => Object.fromEntries(keys.map((k,i) => [k, typeof r[i] === 'number' ? r[i] : String(r[i] ?? '').trim()])))
    .filter(r => !/^ejemplo/i.test(String(r.descripcion || r.nombre || '')));
}
function importExcel(tipo, onRows){
  const cols = Object.values(HEADERS[tipo]).join(' · ');
  loadXLSX().catch(()=>{});
  modal(`<h2>Importar desde Excel</h2>
    <p class="small">Sube un archivo <b>.xlsx</b> o <b>.xls</b>. Se lee la primera hoja; la primera fila lleva los encabezados:</p>
    <p class="small"><b>${esc(cols)}</b></p>
    ${tipo==='productos'?'<p class="small muted">IVA: G = general, R = reducido, E = exento (también acepta 16, 8, 0 o "Exento").</p>':''}
    <p class="small muted">Si el ${tipo==='productos'?'código':'RIF'} ya existe, el registro se actualiza; si no, se crea. Los cambios quedan disponibles para todo el equipo.</p>
    <input type="file" id="xl-f" accept=".xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
    <div class="acts"><button class="btn" id="xl-tpl">${ICON.pdf} Descargar plantilla Excel</button><button class="btn" data-act="close">Cancelar</button></div>`, b => {
      b.querySelector('#xl-tpl').onclick = () => exportExcel(tipo, [], `plantilla-${tipo}.xlsx`);
      b.querySelector('#xl-f').onchange = async ev => { const file = ev.target.files[0]; if(!file) return;
        try{ await loadXLSX(); }catch(e){ return toast(e.message, true); }
        const rd = new FileReader();
        rd.onload = () => {
          try{
            const wb = XLSX.read(new Uint8Array(rd.result), { type:'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = normRows(XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' }));
            const need = tipo==='productos' ? 'codigo' : 'nombre';
            if(!rows.length || !rows.some(r => r[need])) throw new Error(`no se encontró la columna "${HEADERS[tipo][need]}" o la hoja está vacía`);
            closeModal(); onRows(rows);
          }catch(e){ toast('No se pudo leer el Excel: ' + e.message, true); }
        };
        rd.readAsArrayBuffer(file); };
    });
}
function download(name, content, type){
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

function applyConfig(cfg){ DB.config = mergeConfig(cfg); saveCache(); }
function resizeImage(file, maxW, maxH){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, maxW/img.width, maxH/img.height); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const png = cv.toDataURL('image/png'); res(png.length > 150000 ? cv.toDataURL('image/jpeg', 0.88) : png);
    }; img.onerror = rej; img.src = rd.result; };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });

/* ---------- Inicio ---------- */
async function boot(){
  if(!API) return renderApiSetup();
  if(loadCache()){
    startApp();
    if(await refresh(true)){ renderShell(); if(canAutoRefresh()) route(true); autoTasa(); }
    else toast('Sin conexión: mostrando los últimos datos guardados en este teléfono.', true);
    return;
  }
  const L = $('#login'); $('#app').classList.add('hidden'); L.classList.remove('hidden');
  L.innerHTML = `<div class="box"><img src="${LOGO_UNIQUE}" alt=""><p class="muted small" style="text-align:center">Cargando…</p></div>`;
  if(await refresh(true)){ startApp(); autoTasa(); return; }
  L.innerHTML = `<div class="box"><img src="${LOGO_UNIQUE}" alt=""><h1>Sin conexión</h1><p class="muted small">No se pudo conectar con el servidor.</p>
    <p class="small" style="text-align:left;background:#fff7e6;border-radius:8px;padding:10px;color:#7a4b00;word-break:break-word">${esc(LAST_ERR || 'Error desconocido')}</p>
    <p class="small muted" style="text-align:left">Prueba: abre <a href="${esc(API)}" target="_blank" rel="noopener">el servidor</a>. Debe mostrar solo el texto <b>"Servidor del cotizador activo."</b></p>
    <div class="btns" style="justify-content:center"><button class="btn pri" id="rt">Reintentar</button>${API_URL?'':'<button class="btn" id="chg">Cambiar servidor</button>'}</div></div>`;
  $('#rt').onclick = () => boot();
  const ch = $('#chg'); if(ch) ch.onclick = () => { LS.del('cotizador2_api'); API=''; renderApiSetup(); };
}
boot();
